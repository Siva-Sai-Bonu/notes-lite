# Three containers:
#   redis     - Docker Hub, stores the notes
#   nginx     - Docker Hub, reverse proxy / single entry point on :8080
#   notes-api - built from ./app, the app itself
services:

  redis:
    image: redis:7-alpine
    container_name: notes-redis
    volumes:
      - redis-data:/data
    command: ["redis-server", "--save", "60", "1"]   # snapshot every 60s if >=1 key changed
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [notes-net]

  notes-api:
    build: ./app
    image: ${DOCKERHUB_USER:-shiva}/notes-api:${APP_VERSION:-local}
    container_name: notes-api
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    restart: on-failure
    networks: [notes-net]

  nginx:
    build: ./nginx
    container_name: notes-nginx
    ports:
      - "8080:80"
    depends_on:
      - notes-api
    networks: [ notes-net ]

volumes:
  redis-data:

networks:
  notes-net:
    driver: bridge
